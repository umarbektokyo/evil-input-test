<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>volume, but you have to pump it</title>
<style>
  html, body { margin: 0; background: #292b47; color: #eceae3; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #stage {
    width: 800px; height: 400px; overflow: hidden; position: relative; background: #23243d;
    cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #stage:focus { outline: none; }
  svg { display: block; }
  #handle { transition: transform .14s ease-out; }
  #handle.down { transform: translateY(56px); transition-duration: .07s; }
  #stage.popped svg { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
</style>
</head>
<body>
<div id="stage" tabindex="0" aria-label="volume pump: press and release to pump the volume up">
  <svg width="800" height="400" viewBox="0 0 800 400" aria-hidden="true">
    <g id="handle">
      <rect x="296" y="118" width="8" height="70" fill="#8d8aa6"/>
      <rect x="244" y="104" width="112" height="16" rx="8" fill="#f5a885"/>
    </g>
    <rect x="276" y="176" width="48" height="148" rx="8" fill="#3f4168"/>
    <rect x="236" y="320" width="128" height="12" rx="6" fill="#3f4168"/>

    <text x="540" y="182" text-anchor="middle" fill="#8d8aa6" font-size="16" font-family="ui-monospace, Menlo, monospace">volume</text>
    <text id="pct" x="540" y="262" text-anchor="middle" fill="#eceae3" font-size="88" font-family="ui-monospace, Menlo, monospace">0%</text>

    <text x="400" y="378" text-anchor="middle" fill="#545480" font-size="13" font-family="ui-monospace, Menlo, monospace">press to pump. it leaks.</text>
  </svg>
</div>
<script>
(() => {
  const stage = document.getElementById('stage');
  const handle = document.getElementById('handle');
  const pct = document.getElementById('pct');
  let volume = 0, down = false, popped = false;

  const render = () => { if (!popped) pct.textContent = Math.round(volume) + '%'; };

  function press() {
    if (popped || down) return;
    down = true;
    handle.classList.add('down');
  }
  function release() {
    if (!down) return;
    down = false;
    handle.classList.remove('down');
    volume = Math.min(100, volume + 6 + Math.random() * 5);
    render();
    if (volume >= 100) pop();
  }
  // pump past 100 and it pops
  function pop() {
    popped = true;
    pct.textContent = 'pop.';
    stage.classList.add('popped');
    setTimeout(() => { volume = 0; popped = false; stage.classList.remove('popped'); render(); }, 1200);
  }

  stage.addEventListener('pointerdown', (e) => { e.preventDefault(); stage.focus(); press(); });
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  stage.addEventListener('keydown', (e) => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); press(); } });
  stage.addEventListener('keyup', (e) => { if (e.code === 'Space') release(); });

  // it leaks, faster the more you've pumped
  setInterval(() => {
    if (popped || volume <= 0) return;
    volume = Math.max(0, volume - (0.06 + volume * 0.004));
    render();
  }, 60);
})();
</script>
</body>
</html>
